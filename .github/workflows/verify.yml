name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    name: registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml==6.0.2
      - run: python tools/validate_registry.py
      - run: python tools/render_status.py --check

  lean-policy:
    name: lean-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/lean_policy.py

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Every commit carries Signed-off-by
        run: |
          base=${{ github.event.pull_request.base.sha }}
          head=${{ github.event.pull_request.head.sha }}
          fail=0
          for c in $(git rev-list --no-merges "$base..$head"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $c is missing a Signed-off-by line (use git commit -s)"
              fail=1
            fi
          done
          exit $fail

  lean-build:
    name: lean-build
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache project build
        uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lake-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ hashFiles('lean/**/*.lean') }}
          restore-keys: lake-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      - name: Fetch Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Build
        working-directory: lean
        run: lake build
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml==6.0.2
      - name: Axiom audit of every tier-L declaration
        run: python tools/axiom_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axiom-audit
          path: lean/.axiom_audit/

  certificates:
    name: certificates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Helium, reduced check (Hylleraas order 6, 512-bit intervals)
        run: python certificates/run_checks.py --quick
