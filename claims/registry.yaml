- id: S8-001
  sector: S8
  title: Weighted analyticity of the helium ground state at the triple collision (paper; needs human review)
  tier: P1
  status: foundation
  provenance: v1.0-foundation
  statement: >
    For fixed Z >= 2 the extracted remainder R_Z = e^{ZS - u/2} psi_Z - kappa_Z psi_Z(0) q log(r^2+s^2)
