# ---------------------------------------------------------------- S1 foundations
- id: S1-001
  sector: S1
  title: Self-adjointness and ground-energy identification for atoms (all N, real Z)
  tier: L
  status: foundation
  provenance: v1.0-foundation
  statement: >
    For every N and real Z, the fermionic N-electron single-nucleus Coulomb operator,
    defined by its weak-derivative graph on antisymmetric L^2((R^3 x {up,down})^N), is
    self-adjoint with domain exactly the componentwise-H^2 fermionic vectors. Its
    variational (H^2), form (H^1) and spectral ground energies coincide at a finite E with
    -N max(Z,0)^2/2 <= E <= 0. E lies in the spectrum, and the spectrum is real and >= E.
    The same holds for the scalar (no-symmetry) operator on L^2(R^{3N}).
  lean:
    - {module: CoulombSpectralFoundation_v3, decl: TheoremT.Continuum.coulomb_shared_continuum_foundation}
    - {module: ScalarCoulombFoundation_v1, decl: TheoremT.Continuum.scalar_coulomb_continuum_foundation}
  card: claims/cards/S1-001.md
  evidence: [lean/Foundation/CoulombSpectralFoundation_v3.lean, lean/Foundation/ScalarCoulombFoundation_v1.lean, lean/Foundation/ContinuumFoundation_v1.lean]
  caveats: Atoms only (one nucleus). The spectrum is a project definition (bounded two-sided inverse into the domain). Mathematically this is Kato (1951).

- id: S1-002
  sector: S1
  title: No bound state for non-attracting nucleus
  tier: L
  status: foundation
  provenance: v1.0-foundation
  statement: For N >= 1 and Z <= 0 the ground energy is 0, 0 is in the spectrum, and there is no zero-energy eigenvector.
  lean:
    - {module: CoulombUnboundNonpositive_v1, decl: TheoremT.Continuum.nonpositive_charge_zero_spectrum_trivial_kernel}
  card: claims/cards/S1-002.md
  evidence: [lean/Foundation/CoulombUnboundNonpositive_v1.lean]

- id: S1-003
  sector: S1
  title: Hydrogen ground energy -Z^2/2 with spin, and a kernel-checked certificate checker
  tier: L
  status: foundation
  provenance: v1.0-foundation
  statement: >
    For real Z > 0 the one-electron full-spin operator has variational, form and spectral
    ground energy exactly -Z^2/2, with two linearly independent H^2 eigenvectors. For
    natural Z, any rational interval accepted by hydrogenExactCertificateCheck encloses the
    spectral ground energy, and hydrogenExactSolver returns the zero-width interval.
  lean:
    - {module: HydrogenSpinGround_v1, decl: TheoremT.Continuum.hydrogen_full_spin_ground}
    - {module: HydrogenExactSolver_v1, decl: TheoremT.Continuum.hydrogenExactSolver_correct}
    - {module: HydrogenExactSolver_v1, decl: TheoremT.Continuum.hydrogenExactCertificateCheck_sound}
  card: claims/cards/S1-003.md
  evidence: [lean/Foundation/HydrogenSpinGround_v1.lean, lean/Foundation/HydrogenExactSolver_v1.lean]
  caveats: The "solver" returns the closed form. The content is identifying the eigenpair inside the unbounded operator. No upper bound on multiplicity.

- id: S1-004
  sector: S1
  title: Hydrogen rank-one (2s-level) form comparison chain
  tier: L
  status: foundation
  provenance: v1.0-foundation
  statement: >
    One-electron hydrogenic form bounds with literal kinetic and Coulomb integrals. On the
    half-line domain, vectors orthogonal to r e^{-Zr} have radial form >= -Z^2/8. The radial
    and physical rank-one comparisons q_Z(u) >= -Z^2/8 ||u||^2 - 3Z^2/8 |<g,u>|^2 hold on
    punctured smooth cores and extend to all weak-H^1 functions. Supporting results: the sharp
    Poincare inequality on S^2 for C^1 functions, and the kernel of the weak radial ODE.
  lean:
    - {module: HalfLineHydrogenComplement_v1, decl: TheoremT.HalfLine.hydrogen_radial_complement}
    - {module: HalfLineHydrogenRankOne_v1, decl: TheoremT.HalfLine.hydrogen_radial_rank_one}
    - {module: HalfLineWeakODE_v1, decl: TheoremT.OneDimensional.weak_radial_ode_kernel}
    - {module: HydrogenSphereC1Limit_v1, decl: TheoremT.HydrogenSphereC1Limit.sphere_poincare_contDiff_one}
    - {module: HydrogenPhysicalCoreComparison_v1, decl: TheoremT.Continuum.hydrogen_physical_core_rank_one}
    - {module: PuncturedFormComparisonTransfer_v1, decl: TheoremT.Continuum.punctured_core_rankOne_bound_extends_weakH1}
  card: claims/cards/S1-004.md
  evidence: [lean/Foundation/HalfLineHydrogenComplement_v1.lean, lean/Foundation/HydrogenPhysicalCoreComparison_v1.lean]

# ---------------------------------------------------------------- S2 two-electron theory
- id: S2-001
  sector: S2
  title: Abstract rank-one / finite-defect ground branch and continuum Temple enclosure
  tier: L
  status: foundation
  provenance: v1.0-foundation
  statement: >
    For the N-electron atomic operator H: suppose beta||x||^2 <= Re<x,Hx> + C|l(x)|^2 on D(H),
    with l of rank one or rank m, and some unit trial has energy below beta. Then the ground
    energy is < beta, it is attained, and the ground eigenspace has dimension <= m
    (rank one: the rest of the spectrum has real part >= beta). If a unit psi also has
    mean in [L,U], U < beta and ||H psi - mu psi||^2 <= r, then E in [L - r/(beta-U), U].
    Includes the abstract lemmas partner_gap_transfer and two_hydrogenic_comparisons_combine.
  conditional_on:
    - The form comparison (hypothesis hbound); discharged for N=2 in S2-002.
    - The trial data (mean and residual bounds).
  lean:
    - {module: CoulombRankOneBranch_v1, decl: TheoremT.Continuum.coulomb_rankOne_ground_branch}
    - {module: CoulombRankOneCertificate_v1, decl: TheoremT.Continuum.coulomb_rankOne_directed_spectral_enclosure}
    - {module: CoulombFiniteDefectGround_v1, decl: TheoremT.Continuum.coulomb_finite_defect_ground}
    - {module: PartnerGapTransfer_v1, decl: TheoremT.OperatorTheory.partner_gap_transfer}
    - {module: CommutingProjectionComparison_v1, decl: TheoremT.OperatorTheory.two_hydrogenic_comparisons_combine}
  card: claims/cards/S2-001.md
  evidence: [lean/Foundation/CoulombRankOneBranch_v1.lean, lean/Foundation/CoulombRankOneCertificate_v1.lean]
  caveats: Temple (1928) and Kato (1949) in unbounded form. Standard mathematics, formalized.

- id: S2-002
  sector: S2
  title: Two-electron ground state exists, is nondegenerate, and is separated from the rest of the spectrum by -5Z^2/8 (includes helium)
  tier: L
  status: foundation
  provenance: v1.0-foundation
  depends_on: [S2-001]
  statement: >
    For real Z > 0 the two-electron fermionic operator satisfies
    Re<x,Hx> >= -5Z^2/8 ||x||^2 - 3Z^2/8 |<s,x>|^2 (s is the hydrogenic singlet). If 9Z^2 > 32,
    the ground energy is < -5Z^2/8 and attained, the ground eigenspace is one complex line,
    and every other spectral point has real part >= -5Z^2/8. For helium (Z = 2) this gives
    E_He < -5/2 with the rest of the spectrum at real part >= -5/2.
  lean:
    - {module: TwoElectronOperatorComparison_v1, decl: TheoremT.Continuum.twoElectron_operator_rank_one}
    - {module: HydrogenProductTrialEnergy_v1, decl: TheoremT.Continuum.hydrogenProductTrial_strict}
    - {module: TwoElectronPhysicalGroundBranch_v1, decl: TheoremT.Continuum.twoElectron_physical_ground_branch}
    - {module: TwoElectronPhysicalGroundBranch_v1, decl: TheoremT.Continuum.helium_physical_ground_branch}
    - {module: TwoElectronGroundMultiplicity_v1, decl: TheoremT.Continuum.twoElectron_ground_eigenspace_line}
  card: claims/cards/S2-002.md
  evidence: [lean/Foundation/TwoElectronPhysicalGroundBranch_v1.lean, lean/Foundation/TwoElectronGroundMultiplicity_v1.lean]
  caveats: Classical intermediate-problem separator (Bazley). The 9Z^2 > 32 range comes from a crude repulsion bound (open problem S2.4).

- id: S2-003
  sector: S2
  title: Two-electron Temple enclosure with the physical separator proved
  tier: L
  status: foundation
  provenance: v1.0-foundation
  depends_on: [S2-002]
  statement: >
    For real Z > 0: a unit H^2 two-electron trial with mean in [L,U], U < -5Z^2/8 and squared
    residual <= r gives L - r/(-5Z^2/8 - U) <= E <= U for the spectral ground energy.
  conditional_on:
    - The trial's mean and residual bounds are hypotheses. No trial is instantiated in Lean (open problem S2.3).
  lean:
    - {module: TwoElectronPhysicalCertificate_v1, decl: TheoremT.Continuum.twoElectron_physical_directed_spectral_enclosure}
  card: claims/cards/S2-003.md
  evidence: [lean/Foundation/TwoElectronPhysicalCertificate_v1.lean]

- id: S2-004
  sector: S2
  title: Rank-one separator for integer Z >= 2 (paper)
  tier: P1
  status: foundation
  provenance: v1.0-foundation
  statement: For integer Z >= 2, H_Z >= -Z^2 P_0 - (5Z^2/8)(I - P_0), so sigma(H_Z) is {E_Z} together with a subset of [-5Z^2/8, infinity), and E_Z is simple.
  evidence: [archive/v1.0-research-notes/reports/TWO_ELECTRON_THEOREM.md, archive/v1.0-research-notes/helium_research/lower_bounds.md]
  caveats: Superseded in Lean by S2-002 for 9Z^2 > 32.

- id: S2-005
  sector: S2
  title: Separator for real Z > (20+5 sqrt 10)/24 via the Z - 5/16 trial (paper)
  tier: P1
  status: foundation
  provenance: v1.0-foundation
  statement: For real Z > Z* = (20+5 sqrt 10)/24 ~ 1.492, the trial alpha = Z - 5/16 has mean -(Z-5/16)^2 < -5Z^2/8, with margin (96Z^2-160Z+25)/256.
  evidence: [archive/v1.0-research-notes/continuation/paper/TWO_ELECTRON_PHYSICAL_COMPARISON_v1.md]

- id: S2-006
  sector: S2
  title: Variance-minimization selection counterexample (paper)
  tier: P1
  status: foundation
  provenance: v1.0-foundation
  statement: There are a bounded self-adjoint operator and nested rational spaces with exponentially small ground residual for which every exact global variance minimizer is the non-ground state.
  evidence: [archive/v1.0-research-notes/reports/TWO_ELECTRON_THEOREM.md]

- id: S2-007
  sector: S2
  title: Fixed-shift selection and computability of E_Z (paper)
  tier: P1
  status: foundation
  provenance: v1.0-foundation
  statement: Minimizing the regularized ||(H - sigma) phi||^2 with a fixed shift sigma below the spectrum selects the ground branch. On a graph-dense core the Temple loop terminates for every p, so E_Z is computable (no cost bound).
  evidence: [archive/v1.0-research-notes/reports/TWO_ELECTRON_THEOREM.md, archive/v1.0-research-notes/audit-v1/computation/COMPUTATION_SPECTRAL_AUDIT_v1.md]

- id: S2-008
  sector: S2
