  tier: O
  status: active
  provenance: v1.0-foundation
  statement: For fixed Z >= 2, a deterministic algorithm outputs rationals l <= E_Z <= u with u - l <= 2^-p in C_Z (p+1)^d bit operations for some fixed d.
