# ---------------------------------------------------------------- S2 two-electron theory
- id: S2-001
  sector: S2
  title: Abstract rank-one / finite-defect ground branch and continuum Temple enclosure
  tier: L
  status: foundation
  provenance: v1.0-foundation
  statement: >
    For the N-electron atomic operator H: suppose beta||x||^2 <= Re<x,Hx> + C|l(x)|^2 on D(H),
    with l of rank one or rank m, and some unit trial has energy below beta. Then the ground
    energy is < beta, it is attained, and the ground eigenspace has dimension <= m
    (rank one: the rest of the spectrum has real part >= beta). If a unit psi also has
    mean in [L,U], U < beta and ||H psi - mu psi||^2 <= r, then E in [L - r/(beta-U), U].
    Includes the abstract lemmas partner_gap_transfer and two_hydrogenic_comparisons_combine.
  conditional_on:
    - The form comparison (hypothesis hbound); discharged for N=2 in S2-002.
    - The trial data (mean and residual bounds).
  lean:
    - {module: CoulombRankOneBranch_v1, decl: TheoremT.Continuum.coulomb_rankOne_ground_branch}
    - {module: CoulombRankOneCertificate_v1, decl: TheoremT.Continuum.coulomb_rankOne_directed_spectral_enclosure}
    - {module: CoulombFiniteDefectGround_v1, decl: TheoremT.Continuum.coulomb_finite_defect_ground}
    - {module: PartnerGapTransfer_v1, decl: TheoremT.OperatorTheory.partner_gap_transfer}
    - {module: CommutingProjectionComparison_v1, decl: TheoremT.OperatorTheory.two_hydrogenic_comparisons_combine}
  card: claims/cards/S2-001.md
  evidence: [lean/Foundation/CoulombRankOneBranch_v1.lean, lean/Foundation/CoulombRankOneCertificate_v1.lean]
  caveats: Temple (1928) and Kato (1949) in unbounded form. Standard mathematics, formalized.

- id: S2-002
  sector: S2
  title: Two-electron ground state exists, is nondegenerate, and is separated from the rest of the spectrum by -5Z^2/8 (includes helium)
  tier: L
  status: foundation
  provenance: v1.0-foundation
  depends_on: [S2-001]
  statement: >
    For real Z > 0 the two-electron fermionic operator satisfies
    Re<x,Hx> >= -5Z^2/8 ||x||^2 - 3Z^2/8 |<s,x>|^2 (s is the hydrogenic singlet). If 9Z^2 > 32,
    the ground energy is < -5Z^2/8 and attained, the ground eigenspace is one complex line,
    and every other spectral point has real part >= -5Z^2/8. For helium (Z = 2) this gives
    E_He < -5/2 with the rest of the spectrum at real part >= -5/2.
  lean:
    - {module: TwoElectronOperatorComparison_v1, decl: TheoremT.Continuum.twoElectron_operator_rank_one}
    - {module: HydrogenProductTrialEnergy_v1, decl: TheoremT.Continuum.hydrogenProductTrial_strict}
    - {module: TwoElectronPhysicalGroundBranch_v1, decl: TheoremT.Continuum.twoElectron_physical_ground_branch}
    - {module: TwoElectronPhysicalGroundBranch_v1, decl: TheoremT.Continuum.helium_physical_ground_branch}
    - {module: TwoElectronGroundMultiplicity_v1, decl: TheoremT.Continuum.twoElectron_ground_eigenspace_line}
  card: claims/cards/S2-002.md
  evidence: [lean/Foundation/TwoElectronPhysicalGroundBranch_v1.lean, lean/Foundation/TwoElectronGroundMultiplicity_v1.lean]
  caveats: Classical intermediate-problem separator (Bazley). The 9Z^2 > 32 range comes from a crude repulsion bound (open problem S2.4).

- id: S2-003
  sector: S2
  title: Two-electron Temple enclosure with the physical separator proved
  tier: L
  status: foundation
  provenance: v1.0-foundation
  depends_on: [S2-002]
  statement: >
    For real Z > 0: a unit H^2 two-electron trial with mean in [L,U], U < -5Z^2/8 and squared
    residual <= r gives L - r/(-5Z^2/8 - U) <= E <= U for the spectral ground energy.
  conditional_on:
