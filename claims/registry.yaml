# ---------------------------------------------------------------- S8 regularity and approximation
- id: S8-001
  sector: S8
  title: Weighted analyticity of the helium ground state at the triple collision (paper; needs human review)
  tier: P1
  status: foundation
  provenance: v1.0-foundation
  statement: >
    For fixed Z >= 2 the extracted remainder R_Z = e^{ZS - u/2} psi_Z - kappa_Z psi_Z(0) q log(r^2+s^2)
    obeys |d^nu (R_Z - psi_Z(0))| <= C A^{|nu|} nu! S^{1-|nu|} near the triple-collision vertex,
    in half-perimetric coordinates.
  evidence: [archive/v1.0-research-notes/rwa_proof/RWA_THEOREM.md, archive/v1.0-research-notes/rwa_proof/UNIFORM_ANALYTIC_AUDIT.md, archive/v1.0-research-notes/audit-v1/analytic/ANALYTIC_AUDIT_v1.md, archive/v1.0-research-notes/continuation/audits/ACTUAL_EIGENFUNCTION_RWA_AND_APPROXIMATION_v1.md]
  caveats: If correct, it goes beyond the published C^{1,1} regularity at the triple point. Only AI agents have reviewed it. Open problem S8.1.

- id: S8-002
  sector: S8
  title: H^2 approximation rate exp(-c n^{1/3}) for helium by an explicit dyadic dictionary (paper; needs human review)
  tier: P1
  status: foundation
  provenance: v1.0-foundation
  depends_on: [S8-001]
  statement: For fixed Z >= 2 the dictionary V_n = sum_{j <= n/2} e^{-Z 2^j (r+s)} P^sym_{n-2j}(r,s,u) contains v with ||psi_Z - v||_{H^2} <= C exp(-c n^{1/3}).
  evidence: [archive/v1.0-research-notes/continuation/audits/OPEN_APPROXIMATION_LEMMA_ADVERSARIAL_REVIEW_v1.md, archive/v1.0-research-notes/continuation/audits/ENDPOINT_ONE_THIRD_v3.md]
  caveats: Existence only. There is no coefficient-selection algorithm and no explicit constants.

- id: S8-003
  sector: S8
  title: Fixed-exponent Hylleraas residual obstruction, "Theorem C" (paper)
  tier: P1
  status: foundation
  provenance: v1.0-foundation
  statement: For fixed Z >= 2 and a fixed finite exponent set, the best normalized residual in e^{-a(r+s)} poly_n(r,s,u) spaces is >= c (n+1)^{-72}. Hence a p-bit Temple width needs n >~ 2^{p/144}.
  evidence: [archive/v1.0-research-notes/reports/TWO_ELECTRON_THEOREM.md]
  caveats: Qualitatively expected from Fock's logarithm. The exponent 72 is an artifact of the proof.
