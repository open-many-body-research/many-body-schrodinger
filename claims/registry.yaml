    - {module: HalfLineHydrogenRankOne_v1, decl: TheoremT.HalfLine.hydrogen_radial_rank_one}
    - {module: HalfLineWeakODE_v1, decl: TheoremT.OneDimensional.weak_radial_ode_kernel}
